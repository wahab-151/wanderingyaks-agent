# Drive segments between locations.
#
# LAYER: region. Road facts, shared across tenants.
#
# id is always "from>to". verify.ts treats a segment it cannot find as an
# UNKNOWN_SEGMENT violation rather than assuming a default duration - an
# invented road is exactly the failure mode this file exists to catch.
#
# driveHours is realistic moving time for a tour vehicle including normal stops,
# NOT best-case mapping-app time. maxAltitudeM is the highest point crossed on
# the segment, which matters for passengers even when they do not sleep there.
meta:
  region: gilgit-baltistan
  verified: false # PENDING OPERATOR SIGN-OFF - these numbers drive the DRIVE_HOURS check
  source: operator estimate placeholder

