# Locations in the Gilgit-Baltistan operating region.
#
# LAYER: region. These are geographic facts, shared by every tenant operating
# here. They are not commercial data and contain no operator-specific values.
#
# elevationM is the SLEEPING elevation of the settlement, not the summit or the
# highest point reachable from it. verify.ts uses it for acclimatisation checks,
# so an inflated value produces false violations and a deflated one lets a
# dangerous itinerary through.
meta:
  region: gilgit-baltistan
  country: PK
  verified: false # PENDING OPERATOR SIGN-OFF - see docs/KB-SOURCES.md
  source: compiled from public geographic data, not yet checked against operator records

