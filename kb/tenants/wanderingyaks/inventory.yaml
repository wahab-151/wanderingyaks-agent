# Bookable inventory and unit rates.
#
# LAYER: tenant. These are commercial terms - which properties this operator
# holds contracts with, and what they pay. Another operator in the same valleys
# has a different file.
#
# ============================================================================
# EVERY RATE IN THIS FILE IS A PLACEHOLDER.
#
# No real Wandering Yaks cost data was available when this file was written.
# The numbers are order-of-magnitude guesses that let the pipeline run end to
# end; they are NOT the operator's rates and must not appear in a real quote.
#
# price.ts reads this file and nothing else for cost. Replacing these values
# with the real cost sheet is the single highest-value data task in the project.
# See docs/KB-SOURCES.md for exactly which numbers are needed.
# ============================================================================
