# Inventory for the fictional second operator.
#
# Deliberately a different business: campsites and guesthouses rather than forts
# and resorts, own jeeps rather than hired coasters, trek staff on the books.
# Cheaper per night and the trips it can build are shaped differently as a
# result - which is the point of holding this at the tenant layer rather than
# the region layer.
#
# Every rate is fabricated, for a company that does not exist.
meta:
  tenant: highpass-demo
  ratesVerified: false
  currency: USD

